name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catches a VectorCraft release that changes its asset names or archive layout.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: End-to-end (download vectorcraft-cli and render a sample)
        run: npm run test:e2e

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vsce package --no-dependencies -o vectorcraft-viewer.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-viewer-vsix
          path: vectorcraft-viewer.vsix
